<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Heart for Sonia 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050006;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #ff8ac7;
}

canvas {
    width: min(95vw, 600px);
    height: min(75vh, 600px);
}

h1 {
    margin-top: -35px;
    font-size: clamp(30px, 7vw, 55px);
    color: #ff5db1;
    letter-spacing: 8px;
    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493,
        0 0 50px #ff1493;
    opacity: 0;
    animation: appear 2s ease forwards;
    animation-delay: 4s;
}

p {
    margin-top: 15px;
    color: #ffacd8;
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0;
    animation: appear 2s ease forwards;
    animation-delay: 5s;
}

@keyframes appear {
    to {
        opacity: 1;
    }
}
</style>
</head>

<body>

<canvas id="heart"></canvas>

<p>MADE WITH LOVE 🩷</p>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width, height;
let progress = 0;
let particles = [];

function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    width = rect.width;
    height = rect.height;
}

window.addEventListener("resize", resize);
resize();

// The mathematical heart curve
function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const scale = Math.min(width, height) / 38;

    return {
        x: width / 2 + x * scale,
        y: height / 2 - y * scale
    };
}

// Create floating sparkles
function createParticle() {
    particles.push({
        x: Math.random() * width,
        y: height + 10,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.7 + 0.3,
        opacity: Math.random() * 0.8 + 0.2
    });
}

function drawHeart() {
    ctx.clearRect(0, 0, width, height);

    // Floating pink sparkles
    if (Math.random() < 0.15) {
        createParticle();
    }

    particles.forEach((p, i) => {
        p.y -= p.speed;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 100, 190, ${p.opacity})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff1493";
        ctx.fill();

        if (p.y < -10) {
            particles.splice(i, 1);
        }
    });

    // Draw the heart gradually
    const totalPoints = 500;
    const end = Math.floor(progress * totalPoints);

    ctx.beginPath();

    for (let i = 0; i <= end; i++) {
        const t = (i / totalPoints) * Math.PI * 2;
        const point = heartPoint(t);

        if (i === 0) {
            ctx.moveTo(point.x, point.y);
        } else {
            ctx.lineTo(point.x, point.y);
        }
    }

    // Glowing pink outline
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#ff69b4";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff1493";
    ctx.stroke();

    // A brighter glow
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#ffffff";
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ffffff";
    ctx.stroke();

    ctx.shadowBlur = 0;

    if (progress < 1) {
        progress += 0.003;
    } else {
        // Gentle pulsing glow after the drawing finishes
        const pulse = 15 + Math.sin(Date.now() / 250) * 8;

        ctx.beginPath();

        for (let i = 0; i <= totalPoints; i++) {
            const t = (i / totalPoints) * Math.PI * 2;
            const point = heartPoint(t);

            if (i === 0) {
                ctx.moveTo(point.x, point.y);
            } else {
                ctx.lineTo(point.x, point.y);
            }
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = "#ff69b4";
        ctx.shadowBlur = pulse;
        ctx.shadowColor = "#ff1493";
        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    requestAnimationFrame(drawHeart);
}

drawHeart();
</script>

</body>
</html>
